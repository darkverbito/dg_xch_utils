[package]
name = "dg_xch_roots"
description = "Derived coin-set commitment roots: the v1 coin-set MMR + spent-bitmap accumulator and the read-only derivation tool that emits SES-boundary roots from a synced store."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

# DERIVATION ONLY (docs/coin-roots/README.md): no consensus change, no wire change, no sync-path
# change. This crate is deliberately outside core/consensus and stores/ — it re-reads the store
# schemas/file formats those crates own, strictly read-only, and never links the node engine.

[[bin]]
name = "coin-root-derive"
path = "src/bin/coin_root_derive.rs"

[dependencies]
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false, features = ["sqlite", "postgres"] }
sha2 = "0.10.9"
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "postgres"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
futures-util = "0.3.32"

[dev-dependencies]
dg_xch_stores = { path = "../stores", version = "3.0.0", features = ["mmap"] }
dg_xch_serialize = { path = "../serialize", version = "3.0.0" }
tempfile = "3"
