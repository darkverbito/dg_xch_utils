[package]
name = "dg_xch_cli"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr"]
description = "CLI Utilities for the Chia Blockchain"
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[lib]
name = "dg_xch_cli_lib"
path = "src/lib.rs"

[[bin]]
name = "dg_xch_cli"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
bip39 = {version= "2.2.0", features=["rand"] }
blst = { version = "0.3.15", features = ["portable"] }
clap = { version = "4.5.50", features = ["derive"] }
dashmap = "6.1.0"
dialoguer = "0.12.0"
dg_logger = { path="../logging", version="3.0.0" }
dg_xch_clients = {path = "../clients", version="3.0.0"}
dg_xch_core = {path = "../core", version = "3.0.0", default-features = false}
dg_xch_keys = {path = "../keys", version="3.0.0"}
dg_xch_puzzles = {path = "../puzzles", version="3.0.0"}
dg_xch_serialize= {path = "../serialize", version="3.0.0"}
hex = "0.4.3"
lazy_static = "1.5.0"
log = "0.4.28"
num-traits = "0.2.19"
rand = "0.9.2"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = {version = "1.48.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}