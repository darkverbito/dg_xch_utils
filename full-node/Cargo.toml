[package]
name = "full-node"
description = "dg_xch full-node daemon: wires the stores, p2p, node engine, and RPC/wallet servers into one running Chia node."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "full-node"
path = "src/main.rs"

# Leak measurement/regression tool — fetches a real generator from a Postgres node and loops
# the CLVM parse/execute path while reading jemalloc `allocated`. Gated on `postgres` so the mmap
# image build (FEATURES=mmap) skips it instead of failing on the PostgresStore import.
# Prerequisite-validation harness (synthetic timelord + farmer peers): connects to a running
# node p2p WebSocket, captures inbound frames, and asserts the node gossips NewPeakTimelord and
# NewSignagePoint. Operational probe; no store backend, so it builds in every profile.
[lib]
name = "full_node"
path = "src/lib.rs"

# The server layer of the full node: a thin daemon over dg_xch_node (+ the three layers below
# it). Owns config, main, the RPC block/coin endpoints, and the wallet coin-state subscription server. Blind
# to consensus internals. Package name `full-node` (not dg_xch_*) so the binary target matches the crate name.
[dependencies]
portfu = { git = "https://github.com/GalactechsLLC/portfu.git", branch = "2.0.0", features = ["websocket"] }
dg_logger = { path = "../logging", version = "3.0.0" }
log = "0.4"
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false, features = ["bls"] }
dg_xch_serialize = { path = "../serialize", version = "3.0.0" }
dg_xch_stores = { path = "../stores", version = "3.0.0" }
dg_xch_p2p = { path = "../p2p", version = "3.0.0" }
dg_xch_node = { path = "../node", version = "3.0.0" }
zstd = "0.13.2"
# The daemon runs the weight-proof verify itself now (spawn_blocking, off the chaser lock) so a body-download
# retry never re-triggers the multi-minute verify — hence a direct dependency, not only through the node.
dg_xch_weight_proof = { path = "../weight-proof", version = "3.0.0" }
dg_xch_clients = { path = "../clients", version = "3.0.0" }
dg_xch_servers = { path = "../servers", version = "3.0.0" }
async-trait = "0.1.89"
# CIDR matchers for the trusted-peer tier's `--trusted-cidr` list (chia `trusted_cidrs`): parse an
# IPv4/IPv6 CIDR string once at boot, then `IpNet::contains(&IpAddr)` per gate. Already in the lock
# tree (transitive); pinned direct here.
ipnet = "2.12"
uuid = { version = "1.24.0", features = ["v4"] }
bytes = "1.10.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["full"] }
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
rustls = { version = "0.23.37", features = ["ring"] }
# Global allocator: glibc's per-thread 64MB arenas held freed sync-path buffers forever
# (GiB/hour RSS climb → OOM); jemalloc purges dirty pages back to the OS. -ctl exposes
# allocated/resident for the metrics endpoint. background_threads is Linux-only, hence the
# target split below.
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
# Proof-fixture hex compares (the chia_rs 0.42.1 byte-parity gates in daemon.rs wallet_queries).
hex = "0.4.3"
# Test builds get the coin-index store tier (the FF lineage lookup + the FaultStore test double's
# delegating impls, gated any(feature = "coin-index", test)); production feature defaults untouched.
dg_xch_stores = { path = "../stores", version = "3.0.0", features = ["coin-index"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net", "test-util"] }
tokio-rustls = "0.26.4"
uuid = { version = "1.24.0", features = ["v4"] }
# The signed_values emit test forges a farmer's BLS plot signatures over the candidate's foliage
# hashes (AugScheme, portable — matching core's blst). Test-only; production code never touches blst
# (it verifies through dg_xch_core::consensus::producer::verify_plot_signature).
blst = { version = "0.3.16", features = ["portable"] }

[features]
# Sampling CPU profiler and jemalloc heap-dump endpoints on the metrics port. Off by default:
# the same data is available from external tooling against a normal build.
profiling = ["dep:pprof", "tikv-jemallocator/profiling"]
default = ["sqlite"]
# Pi-floor embedded profile: sqlx-SQLite backend (the only backend today).
sqlite = []
# Service-tier secondary indexes (puzzle-hash / parent coin lookups) a pure validating node refuses to build.
coin-index = ["dg_xch_stores/coin-index"]
hint = ["coin-index", "dg_xch_stores/hint", "dg_xch_node/hint"]
# Server-scale profile: the industrial sqlx-Postgres backend plus the service-tier indexes.
# A `postgres://` --db boots PostgresStore; without this feature it is rejected with a clear error.
postgres = ["coin-index", "hint", "dg_xch_stores/postgres"]
# The embedded libbitcoin-style mmap backend (the Pi profile); a mmap:// --db boots MmapStore.
mmap = ["dg_xch_stores/mmap"]
