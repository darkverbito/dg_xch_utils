# Head-to-head peak-memory comparison between clvm_rs and dg_xch's CLVM VM.
#
# Both VMs run the SAME serialized program under the SAME counting global allocator, so the
# numbers are comparable. Peak is measured as the allocator's high-water mark across one run,
# which is the figure that decides whether a node survives window validation.
[package]
name = "clvm-headtohead"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Requires a clvm_rs checkout beside this repo:
#   git clone https://github.com/Chia-Network/clvm_rs.git ../../../clvm_rs-history
# Measured against 0.19.0. Excluded from the workspace so a normal build never needs it.
clvmr = { path = "../../../clvm_rs-history" }
dg_xch_core = { path = "../dgxch-pr-fold/core" }

[profile.release]
debug = false
