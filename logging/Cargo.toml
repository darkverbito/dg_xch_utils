[package]
name = "dg_logger"
version = "3.0.0"
edition = "2024"
description = "Druid Garden Logging Library"
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
bus = "2.4.1"
colored = { version = "3.0", optional = true}
ctrlc = "3.5.0"
log = { version = "0.4.28"}
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.44", features = ["local-offset", "serde","macros","parsing","formatting"]}

[features]
default = ["color"]
color = ["colored"]
