[package]
name = "dg_xch_pos"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr"]
description = "Proof of Space library for the Chia Blockchain"
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
async-trait = "0.1.89"
blake3 = "1.8.2"
dg_xch_core = {path = "../core", version="3.0.0", default-features = false }
futures-util = "0.3.31"
hex = "0.4.3"
lazy_static = "1.5.0"
libc = "0.2.174"
log = "0.4.28"
num-traits = "0.2.19"
once_cell = "1.21.3"
parking_lot = "0.12.5"
rand = "0.9.2"
rayon = "1.11.0"
rustc-hash = "2.1.1"
time = "0.3.44"
tokio = {version = "1.48.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net", "io-util"]}
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = "0.7.0"
dg_logger = { path = "../logging" }

[[bench]]
name = "compression"
harness = false