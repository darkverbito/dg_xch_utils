[package]
name = "dg_xch_simulator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"
name = "dg_xch_simulator_lib"

[[bin]]
path = "src/main.rs"
name = "dg_xch_simulator"

[dependencies]
dg_logger = { path="../logging", version="3.0.0" }
log = "0.4.28"
portfu = { version = "1.3.3" }
tokio = {version = "1.48.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
