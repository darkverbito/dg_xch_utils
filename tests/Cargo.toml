[package]
name = "dg_xch_tests"
version = "2.1.3"
edition = "2021"
authors = ["James Hoerr"]
description = "Low Level Support Package for dg_xch_utils"
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils/serialize"

[dependencies]
dg_xch_core = {path = "../core", version = "2.2.0" }
dg_xch_puzzles = {path = "../puzzles", version="2.2.0"}
dg_parser_macro = {path = "../parser_macro", version="2.2.0"}
hex = "0.4.3"
lazy_static = "1.4.0"
num-traits = "0.2.17"
tokio = {version = "1.35.1", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
paste = "1.0.15"
serde_json = "1.0.133"